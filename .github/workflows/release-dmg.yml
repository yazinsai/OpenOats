name: Build macOS DMG

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to rebuild and publish, for example v1.11.1
        required: true
        type: string
  release:
    types: [published]

jobs:
  build-macos:
    runs-on: macos-26
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && format('refs/tags/{0}', inputs.tag) || github.ref }}
          fetch-depth: 0

      - name: Resolve release metadata
        run: |
          if [[ "${{ github.event_name }}" == "release" ]]; then
            TAG="${{ github.event.release.tag_name }}"
          else
            TAG="${{ inputs.tag }}"
          fi

          VERSION="${TAG#v}"

          echo "RELEASE_TAG=$TAG" >> "$GITHUB_ENV"
          echo "RELEASE_VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "Resolved release tag: $TAG"
          echo "Resolved version: $VERSION"

      - name: Select Xcode 26
        run: bash "${{ github.workspace }}/scripts/select_xcode_26.sh"

      - name: Set version from tag
        run: |
          PLIST="OpenOats/Sources/OpenOats/Info.plist"
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion ${RELEASE_VERSION}" "$PLIST"
          /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString ${RELEASE_VERSION}" "$PLIST"
          echo "Set version to ${RELEASE_VERSION}"

      - name: Run UI smoke suite
        id: ui_smoke
        continue-on-error: ${{ github.event_name == 'workflow_dispatch' }}
        run: |
          chmod +x scripts/run_ui_smoke.sh
          ./scripts/run_ui_smoke.sh

      - name: Report advisory UI smoke failure
        if: github.event_name == 'workflow_dispatch' && steps.ui_smoke.outcome == 'failure'
        run: |
          echo "::warning::UI smoke suite failed while rebuilding a historical tag. Continuing so manual DMG backfills can still complete."

      - name: Check for signing certificate
        env:
          MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
        run: |
          if [[ -n "$MACOS_CERTIFICATE" ]]; then
            echo "HAS_CERT=true" >> "$GITHUB_ENV"
          fi

      - name: Import signing certificate
        if: env.HAS_CERT == 'true'
        env:
          MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
          MACOS_CERTIFICATE_PWD: ${{ secrets.MACOS_CERTIFICATE_PWD }}
        run: |
          CERT_FILE=$(mktemp /tmp/cert.XXXXXX.p12)
          KEYCHAIN_FILE="/tmp/build-$$-$(date +%s).keychain-db"
          KEYCHAIN_PWD=$(openssl rand -base64 32)

          echo "$MACOS_CERTIFICATE" | base64 --decode > "$CERT_FILE"

          curl -sL "https://www.apple.com/certificateauthority/DeveloperIDG2CA.cer" -o /tmp/DeveloperIDG2CA.cer

          security create-keychain -p "$KEYCHAIN_PWD" "$KEYCHAIN_FILE"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_FILE"
          security unlock-keychain -p "$KEYCHAIN_PWD" "$KEYCHAIN_FILE"

          security import /tmp/DeveloperIDG2CA.cer -k "$KEYCHAIN_FILE" -T /usr/bin/codesign
          security import "$CERT_FILE" -P "$MACOS_CERTIFICATE_PWD" -A -t cert -f pkcs12 -k "$KEYCHAIN_FILE"
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PWD" "$KEYCHAIN_FILE"
          security list-keychains -d user -s "$KEYCHAIN_FILE" $(security list-keychains -d user | tr -d '"')

          rm -f "$CERT_FILE" /tmp/DeveloperIDG2CA.cer

          IDENTITY=$(security find-identity -v -p codesigning "$KEYCHAIN_FILE" | grep "Developer ID Application" | head -1 | sed 's/.*"\(.*\)"/\1/')
          echo "CODESIGN_IDENTITY=$IDENTITY" >> "$GITHUB_ENV"
          echo "KEYCHAIN_FILE=$KEYCHAIN_FILE" >> "$GITHUB_ENV"

      - name: Build .app
        env:
          CODESIGN_IDENTITY: ${{ env.CODESIGN_IDENTITY }}
        run: |
          chmod +x scripts/build_swift_app.sh
          ./scripts/build_swift_app.sh

      - name: Build DMG
        env:
          CODESIGN_IDENTITY: ${{ env.CODESIGN_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: |
          chmod +x scripts/make_dmg.sh
          ./scripts/make_dmg.sh

      - name: Cleanup keychain
        if: always()
        run: |
          if [[ -n "${KEYCHAIN_FILE:-}" ]]; then
            security delete-keychain "$KEYCHAIN_FILE" 2>/dev/null || true
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: OpenOats-dmg
          path: dist/OpenOats.dmg

      - name: Attach DMG to Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "${RELEASE_TAG}" dist/OpenOats.dmg --clobber

      - name: Sign DMG and update appcast
        # Prereleases never reach the feed or the cask; download the DMG from the release instead.
        if: github.event.release.prerelease != true
        env:
          SPARKLE_EDDSA_KEY: ${{ secrets.SPARKLE_EDDSA_KEY }}
          # Owner-set repository variables, see docs/release-notes-2.0.md ("Rolling out 2.0").
          SPARKLE_MAJOR_UPGRADE_APPROVED: ${{ vars.SPARKLE_MAJOR_UPGRADE_APPROVED }}
          SPARKLE_PHASED_ROLLOUT_INTERVAL: ${{ vars.SPARKLE_PHASED_ROLLOUT_INTERVAL }}
          GH_TOKEN: ${{ github.token }}
        run: |
          DMG_PATH="dist/OpenOats.dmg"
          MINIMUM_MACOS_VERSION=$(/usr/libexec/PlistBuddy -c 'Print :LSMinimumSystemVersion' dist/OpenOats.app/Contents/Info.plist)

          # Extract sign_update from Sparkle build artifacts
          SIGN_UPDATE=$(find OpenOats/.build/artifacts/sparkle -name "sign_update" -type f 2>/dev/null | head -1)
          if [[ -z "$SIGN_UPDATE" ]]; then
            echo "Error: sign_update not found in Sparkle artifacts"
            exit 1
          fi
          chmod +x "$SIGN_UPDATE"

          # Sign the DMG with EdDSA
          SIGN_OUTPUT=$(echo "$SPARKLE_EDDSA_KEY" | "$SIGN_UPDATE" "$DMG_PATH" --ed-key-file /dev/stdin)
          ED_SIGNATURE=$(echo "$SIGN_OUTPUT" | sed -n 's/.*edSignature="\([^"]*\)".*/\1/p')
          DMG_LENGTH=$(echo "$SIGN_OUTPUT" | sed -n 's/.*length="\([^"]*\)".*/\1/p')

          if [[ -z "$ED_SIGNATURE" ]]; then
            echo "Error: Failed to extract EdDSA signature"
            echo "sign_update output: $SIGN_OUTPUT"
            exit 1
          fi

          echo "EdDSA signature: $ED_SIGNATURE"
          echo "DMG length: $DMG_LENGTH"

          # Release notes shown in the Sparkle update dialog
          NOTES_FILE=$(mktemp)
          gh release view "${RELEASE_TAG}" --json body --jq .body > "$NOTES_FILE"

          # Clone gh-pages branch
          git clone --branch gh-pages --single-branch "https://x-access-token:${GH_TOKEN}@github.com/yazinsai/OpenOats.git" /tmp/gh-pages

          # Regenerate appcast.xml (left untouched for an unapproved new major version)
          python3 scripts/write_appcast.py /tmp/gh-pages/appcast.xml "$RELEASE_VERSION" "$RELEASE_TAG" \
            "$MINIMUM_MACOS_VERSION" "$ED_SIGNATURE" "$DMG_LENGTH" "$NOTES_FILE"

          cd /tmp/gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add appcast.xml
          git commit -m "Update appcast for ${RELEASE_VERSION}" || echo "No changes to commit"
          git push origin gh-pages

      - name: Update Homebrew cask
        if: github.event.release.prerelease != true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          SHA256=$(shasum -a 256 dist/OpenOats.dmg | awk '{print $1}')
          MINIMUM_MACOS_VERSION=$(/usr/libexec/PlistBuddy -c 'Print :LSMinimumSystemVersion' dist/OpenOats.app/Contents/Info.plist)
          REPO_URL="https://x-access-token:${GH_TOKEN}@github.com/yazinsai/OpenOats.git"

          git clone --branch main --single-branch "$REPO_URL" /tmp/openoats-main

          chmod +x /tmp/openoats-main/scripts/update_homebrew_cask.sh
          /tmp/openoats-main/scripts/update_homebrew_cask.sh "$RELEASE_VERSION" "$SHA256" "$MINIMUM_MACOS_VERSION"

          cd /tmp/openoats-main
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Casks/openoats.rb
          if git diff --cached --quiet; then
            echo "No cask changes to commit"
            exit 0
          fi

          git commit -m "Update Homebrew cask for ${RELEASE_VERSION}"

          if git push origin main; then
            exit 0
          fi

          BRANCH="automation/homebrew-cask-${RELEASE_VERSION}"
          git checkout -B "$BRANCH"
          git push origin "$BRANCH" --force

          EXISTING_PR=$(gh pr list \
            --repo yazinsai/OpenOats \
            --head "$BRANCH" \
            --state open \
            --json number \
            --jq '.[0].number // empty')

          if [[ -n "$EXISTING_PR" ]]; then
            echo "Open PR #$EXISTING_PR already exists for $BRANCH"
            exit 0
          fi

          gh pr create \
            --repo yazinsai/OpenOats \
            --base main \
            --head "$BRANCH" \
            --title "Update Homebrew cask for ${RELEASE_VERSION}" \
            --body "Automated follow-up from the release workflow because direct pushes to protected \`main\` are blocked by branch protection." || {
              echo "::warning::Unable to create the Homebrew cask PR automatically. Branch ${BRANCH} was pushed and can be opened manually."
              exit 0
            }
